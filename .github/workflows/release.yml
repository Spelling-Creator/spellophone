name: Release

# Publishes @spelling-creator/spellophone when a GitHub release is published
# (Releases > Draft a new release, tag vX.Y.Z). The tag has to match the
# version in packages/spellophone/package.json. The package goes to GitHub
# Packages (always) and to npmjs.com (only when the repository has an
# NPM_TOKEN secret), and the tarball is attached to the release.
# See apps/docs/docs/project/releasing.md.

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain (node, pnpm, emsdk, cmake)
        uses: jdx/mise-action@v5

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./packages/spellophone/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch espeak-ng
        run: pnpm fetch:espeak

      # `pnpm build` runs build:data, build:wasm and build:ts. The first two
      # must reproduce the committed artifacts exactly.
      - name: Build
        run: pnpm build

      - name: Check that the committed wasm and data are up to date
        run: git diff --stat --exit-code packages/spellophone/wasm packages/spellophone/espeak-ng-data

      - name: Test
        run: pnpm test

      - name: Pack
        working-directory: packages/spellophone
        run: pnpm pack --out spellophone-${GITHUB_REF_NAME}.tgz

      # Node is set up by mise, not actions/setup-node, so nothing writes the
      # registry token into an .npmrc for us. Do it by hand for each registry.
      - name: Publish to GitHub Packages
        working-directory: packages/spellophone
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > ~/.npmrc
          pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs.com
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/spellophone
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm publish --no-git-checks --registry https://registry.npmjs.org --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach the tarball to the release
        run: gh release upload "${GITHUB_REF_NAME}" "packages/spellophone/spellophone-${GITHUB_REF_NAME}.tgz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
