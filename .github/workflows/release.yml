name: Release

# Publishes @spelling-creator/spellophone when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag has to match the version in packages/spellophone/package.json. The
# package goes to GitHub Packages (always) and to npmjs.com (only when the
# repository has an NPM_TOKEN secret). A GitHub release is created with the
# tarball attached and the matching CHANGELOG.md section as its notes.
# See apps/docs/docs/project/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain (node, pnpm, emsdk, cmake)
        uses: jdx/mise-action@v5

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./packages/spellophone/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch espeak-ng
        run: pnpm fetch:espeak

      # `pnpm build` runs build:data, build:wasm and build:ts. The first two
      # must reproduce the committed artifacts exactly.
      - name: Build
        run: pnpm build

      - name: Check that the committed wasm and data are up to date
        run: git diff --stat --exit-code packages/spellophone/wasm packages/spellophone/espeak-ng-data

      - name: Test
        run: pnpm test

      - name: Pack
        working-directory: packages/spellophone
        run: pnpm pack --out spellophone-${GITHUB_REF_NAME}.tgz

      - name: Publish to GitHub Packages
        working-directory: packages/spellophone
        run: pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs.com
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/spellophone
        run: pnpm publish --no-git-checks --registry https://registry.npmjs.org --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: packages/spellophone/spellophone-${{ github.ref_name }}.tgz
