name: Release

# Publishes @spelling-creator/spellophone when a GitHub release is published
# (Releases > Draft a new release, tag vX.Y.Z). The tag has to match the
# version in packages/spellophone/package.json. The package goes to npmjs.com
# through trusted publishing (OIDC, no token), and the same tarball is
# attached to the release. See apps/docs/docs/project/releasing.md.

on:
  release:
    types:
      - published

permissions:
  contents: write
  # Lets npm exchange the workflow's OIDC token for a short-lived publish
  # token. npm checks it against the trusted publisher configured for the
  # package, which names this repository and release.yml.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain (node, pnpm, emsdk, cmake)
        uses: jdx/mise-action@v5

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./packages/spellophone/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` fetches espeak-ng, then runs build:data, build:wasm and
      # build:ts. CI has already checked that this build is reproducible.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack
        working-directory: packages/spellophone
        run: pnpm pack --out spellophone-${GITHUB_REF_NAME}.tgz

      # Publish the tarball packed above, so npm gets byte for byte what is
      # attached to the release. This uses the npm CLI rather than pnpm
      # because npm is what implements trusted publishing (it needs 11.5.1 or
      # later, which Node 24 ships). Provenance is attached automatically.
      - name: Publish to npmjs.com
        working-directory: packages/spellophone
        run: npm publish "spellophone-${GITHUB_REF_NAME}.tgz" --access public

      - name: Attach the tarball to the release
        run: gh release upload "${GITHUB_REF_NAME}" "packages/spellophone/spellophone-${GITHUB_REF_NAME}.tgz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
