name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Build the wasm and the data from espeak-ng's sources with the pinned
  # toolchain, on Linux and on macOS. The other jobs use what Linux built.
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain (node, pnpm, emsdk, cmake)
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch espeak-ng
        run: pnpm fetch:espeak

      - name: Build data and wasm
        run: |
          pnpm --filter @spelling-creator/spellophone build:data
          pnpm --filter @spelling-creator/spellophone build:wasm

      - name: Upload the wasm and data
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: |
            packages/spellophone/wasm
            packages/spellophone/espeak-ng-data
          retention-days: 7

  # The two builds must be identical, byte for byte. Anyone can then rebuild a
  # release from its tag and check it against what is on npm. When they
  # differ, both builds stay downloadable from the run for 7 days
  # (gh run download <id>).
  reproduce:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Download both builds
        uses: actions/download-artifact@v8

      - name: Compare
        run: diff --recursive --brief native-ubuntu-latest native-macos-latest

  # Lint, type-check, test and build everything else, with the Linux build of
  # the wasm and data.
  check:
    needs: native
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the wasm and data
        uses: actions/download-artifact@v8
        with:
          name: native-ubuntu-latest
          path: packages/spellophone

      - name: Lint and format check
        run: pnpm lint

      - name: Bundle the library
        run: pnpm --filter @spelling-creator/spellophone build:ts

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the browser example
        run: pnpm --filter @spellophone/example-browser build

      - name: Run the Node example
        run: pnpm example:node

      - name: Build docs
        run: pnpm build:docs
