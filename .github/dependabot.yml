version: 2

updates:
  # One entry at the root covers every workspace package, since Dependabot
  # resolves pnpm workspaces from the root pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      dev-tooling:
        applies-to: version-updates
        patterns:
          - "oxlint"
          - "oxfmt"
          - "typescript"
          - "@types/*"
          - "tsdown"
          - "vitest"
          - "publint"
        update-types:
          - "minor"
          - "patch"
      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vitepress"
          - "vitepress-plugin-llms"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used by .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
